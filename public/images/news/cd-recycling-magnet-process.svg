<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Construction and demolition recycling magnetic separation process</title>
  <desc id="desc">A simplified process flow showing mixed feed, a self-cleaning suspended magnet before a crusher, a magnetic head pulley and a non-ferrous sorting stage.</desc>
  <rect width="1200" height="520" fill="#071727"/>
  <text x="60" y="70" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700">C&amp;D recycling: a simplified magnetic separation sequence</text>
  <g font-family="Arial, sans-serif" font-size="20" fill="#071727" font-weight="700">
    <rect x="60" y="210" width="175" height="100" rx="8" fill="#e9eef4"/><text x="92" y="252">Mixed C&amp;D</text><text x="98" y="280">feed</text>
    <rect x="320" y="210" width="205" height="100" rx="8" fill="#ffd824"/><text x="346" y="252">Self-cleaning</text><text x="356" y="280">magnet</text>
    <rect x="610" y="210" width="175" height="100" rx="8" fill="#e9eef4"/><text x="660" y="252">Crusher</text><text x="632" y="280">or shredder</text>
    <rect x="870" y="210" width="205" height="100" rx="8" fill="#70d6d0"/><text x="902" y="252">Head pulley /</text><text x="908" y="280">sorting stage</text>
  </g>
  <g stroke="#70d6d0" stroke-width="10" fill="none" stroke-linecap="round"><path d="M240 260h58"/><path d="M530 260h58"/><path d="M790 260h58"/></g>
  <g fill="#70d6d0"><path d="M298 245l25 15-25 15z"/><path d="M588 245l25 15-25 15z"/><path d="M848 245l25 15-25 15z"/></g>
  <path d="M425 190v-55h125" stroke="#ffd824" stroke-width="8" fill="none"/><text x="564" y="143" fill="#ffd824" font-family="Arial, sans-serif" font-size="18">Captured ferrous pieces to discharge zone</text>
  <text x="60" y="415" fill="#b9c7d8" font-family="Arial, sans-serif" font-size="19">Equipment position and final configuration must be confirmed from belt width, burden depth, suspension height, tramp-iron size and access for discharge.</text>
</svg>
